abstract-id: |
  Naskah ini menyusun kerangka Triune-Intelligence Smart Engineering (TISE)
  untuk menghubungkan hasil misi, kapabilitas manusia, dan kelayakan ekosistem.
  Materi konseptual dipetakan melalui PICOC, DRM/DSRM, Q-Cycle, EASTF,
  tahapan inovasi, dan kematangan artefak. Demonstrasi pangan kampus memakai
  simulasi 30 hari sintetik dengan seed 1962. Kebijakan adaptif menghasilkan
  cakupan 94,28% dibandingkan 91,51% pada kebijakan tetap, dengan rasio sisa
  2,61% dibandingkan 2,15%. Hasil menunjukkan pertukaran antarukuran pada
  skenario ini. Pertumbuhan kapabilitas dan keberlanjutan ekosistem belum
  diukur; evaluasi lapangan dan longitudinal dirumuskan sebagai tindak lanjut.

keywords-id:
  - TISE
  - Q-Cycle
  - EASTF
  - rekayasa berorientasi kemanusiaan
  - simulasi sintetik

abstract-en: |
  This manuscript organizes Triune-Intelligence Smart Engineering (TISE)
  around mission outcomes, human capabilities, and ecosystem viability.
  Conceptual material connects PICOC, DRM/DSRM, Q-Cycle, EASTF, innovation
  stages, and artifact maturity. A campus food demonstration uses a
  30-day synthetic simulation with seed 1962. The adaptive policy achieves
  94.28% demand coverage versus 91.51% for the fixed policy, while waste
  ratios are 2.61% and 2.15%, respectively. These results indicate a
  trade-off within this scenario. Human capability growth and ecosystem
  sustainability remain unmeasured and require field and longitudinal evaluation.

